<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Growth & Career OS - Premium Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray">
    <div id="mainContent" class="container text-center fade-in">
        <div class="logo-placeholder"></div>
        
        <h1 class="text-dark">Personal Growth & Career OS</h1>
        <h2 class="text-teal subtitle">Premium Access</h2>

        <div class="card mt-2">
            <p class="mb-1">Enter your unique access code to unlock the system.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="accessCode" placeholder="Enter Access Code (e.g. KSF-1234-5678)" required autocomplete="off">
                </div>
                <div id="loginError" class="error-text hidden">Invalid or used code.</div>
                
                <button type="submit" class="btn btn-teal">Unlock System</button>
            </form>
        </div>
        
        <div class="footer mt-3">
            <small>&copy; 2026 Personal Growth OS</small>
        </div>
    </div>

    <!-- Hidden Admin Section for Quick Access -->
    <div id="adminAccess" class="hidden">
        <div class="container text-center fade-in">
            <h1 class="text-dark">Admin Access</h1>
            <div class="card">
                <form id="adminLoginForm">
                    <div class="form-group">
                        <input type="password" id="adminSecret" placeholder="Enter Password" required>
                    </div>
                    <div id="adminLoginError" class="error-text hidden">Access Denied</div>
                    <button type="submit" class="btn btn-dark">Enter Panel</button>
                </form>
            </div>
        </div>
    </div>

    <div id="adminDashboard" class="hidden">
        <div class="container fade-in">
            <header class="flex-between mb-2">
                <h2 class="text-teal">Admin Dashboard</h2>
                <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
            </header>
            <!-- ... same content as admin.html but integrated here for reliability ... -->
            <div class="card mb-2">
                <h3 class="text-dark mb-1">Generate Premium Code</h3>
                <form id="generateCodeForm">
                    <div class="form-group">
                        <label for="attendeeName">Attendee Name</label>
                        <input type="text" id="attendeeName" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <label for="attendeePhone">WhatsApp Number</label>
                        <input type="tel" id="attendeePhone" placeholder="91XXXXXXXXXX" required>
                    </div>
                    <button type="submit" class="btn btn-red w-100">Generate Code</button>
                </form>
                <div id="generatedResult" class="mt-2 hidden p-1 border-teal rounded bg-light">
                    <p class="text-dark"><strong>Generated Code:</strong></p>
                    <div class="code-display text-teal" id="displayCode"></div>
                    <a href="#" id="whatsappLink" target="_blank" class="btn btn-green mt-1 w-100">Send via WhatsApp</a>
                </div>
            </div>
            <div class="card">
                <h3 class="text-dark mb-1">Recent Attendees</h3>
                <div class="table-responsive">
                    <table class="w-100 text-left">
                        <thead><tr><th>Name</th><th>Phone</th><th>Code</th><th>Status</th></tr></thead>
                        <tbody id="attendeesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
