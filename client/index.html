<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Growth & Career OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainContent" class="screen-container">
        <div id="loginView" class="card">
            <h1 class="text-center text-teal">Career OS</h1>
            <p class="text-center text-muted mb-2">Unlock your personalized career roadmap.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Premium Access Code</label>
                    <input type="text" id="accessCode" placeholder="KSF-XXXX-XXXX" required spellcheck="false">
                    <p id="loginError" class="text-red hidden mt-1" style="font-size: 0.85rem;"></p>
                </div>
                <button type="submit" class="btn btn-primary">Unlock System</button>
            </form>
        </div>

        <div id="accessVerifiedView" class="card hidden">
            <h2 class="text-teal text-center">Access Verified</h2>
            <p class="text-muted text-center mb-2">Welcome to your Personal Growth system.</p>
            <ul class="custom-list">
                <li>Personalized Action Plan</li>
                <li>30 & 90 Day Milestones</li>
                <li>Mistakes to Avoid</li>
            </ul>
            <button id="startAssessmentBtn" class="btn btn-primary">➡️ Start Assessment</button>
        </div>
    </div>

    <!-- Secret Admin (Unlocked via 786786) -->
    <div id="adminAccess" class="screen-container hidden">
        <div class="card">
            <h2 class="text-center">Admin Login</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <input type="password" id="adminSecret" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Enter Panel</button>
            </form>
        </div>
    </div>

    <div id="adminDashboard" class="screen-container hidden">
        <div class="card" style="max-width: 600px;">
            <h3>Generate Access Code</h3>
            <form id="generateCodeForm" class="mb-2">
                <div class="form-group">
                    <label>Attendee Name</label>
                    <input type="text" id="attendeeName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp Number (with country code)</label>
                    <input type="tel" id="attendeePhone" placeholder="91XXXXXXXXXX" required>
                </div>
                <button type="submit" class="btn btn-secondary">Generate Code</button>
            </form>

            <div id="generatedResult" class="card mb-2 hidden" style="border: 2px solid var(--primary); background: #f0fdf4;">
                <p class="text-center font-bold">Code Generated Successfully!</p>
                <div id="displayCode" class="text-center text-teal font-bold" style="font-size: 1.5rem; margin: 10px 0; letter-spacing: 2px;"></div>
                <a href="#" id="whatsappLink" target="_blank" class="btn" style="background-color: #25D366; color: white;">
                    <span>📲 Send Code via WhatsApp</span>
                </a>
            </div>

            <div style="max-height: 200px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead><tr style="text-align: left; border-bottom: 1px solid #eee;"><th>Name</th><th>Code</th><th>Status</th></tr></thead>
                    <tbody id="attendeesTableBody"></tbody>
                </table>
            </div>
            <button onclick="location.reload()" class="btn btn-outline mt-2">Exit Admin</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
