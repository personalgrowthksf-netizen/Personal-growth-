<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray">
    <div id="mainContent" class="screen-container">
        <div id="loginView" class="card">
            <h1 class="text-teal text-center">Career OS</h1>
            <p class="text-center text-muted mb-2">Enter your unique code to unlock.</p>
            <form id="loginForm">
                <input type="text" id="accessCode" placeholder="KSF-XXXX-XXXX" required class="mb-1">
                <p id="loginError" class="text-red hidden mb-1 text-center"></p>
                <button type="submit" class="btn btn-primary">Unlock System</button>
            </form>
        </div>
    </div>

    <div id="adminAccess" class="screen-container hidden">
        <div class="card">
            <h2 class="text-center">Admin</h2>
            <form id="adminLoginForm">
                <input type="password" id="adminSecret" placeholder="Password" required class="mb-1">
                <button type="submit" class="btn btn-primary">Enter</button>
            </form>
        </div>
    </div>

    <div id="adminDashboard" class="screen-container hidden">
        <div class="card" style="max-width: 600px;">
            <h3>Admin Dashboard</h3>
            <form id="generateCodeForm" class="mb-2">
                <input type="text" id="attendeeName" placeholder="Name" required class="mb-1">
                <input type="tel" id="attendeePhone" placeholder="91XXXXXXXXXX" required class="mb-1">
                <button type="submit" class="btn btn-secondary">Generate Unique Code</button>
            </form>
            <div id="generatedResult" class="card hidden mb-2" style="border:2px solid #25D366;">
                <p class="text-center font-bold">Code Generated!</p>
                <div id="displayCode" class="text-center text-teal font-bold mb-1" style="font-size:1.5rem;"></div>
                <a href="#" id="whatsappLink" target="_blank" class="btn" style="background:#25D366; color:white;">Send via WhatsApp</a>
            </div>
            <table style="width:100%;">
                <thead><tr><th>Name</th><th>Code</th><th>Step</th></tr></thead>
                <tbody id="attendeesTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
