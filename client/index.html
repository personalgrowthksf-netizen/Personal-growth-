<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Growth & Career OS - Premium Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray">
    <div class="container text-center fade-in">
        <div class="logo-placeholder"></div>
        
        <h1 class="text-dark">Personal Growth & Career OS</h1>
        <h2 class="text-teal subtitle">Premium Access</h2>

        <div class="card mt-2">
            <p class="mb-1">Enter your unique access code to unlock the system.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="accessCode" placeholder="Enter Access Code (e.g. KSF-1234-5678)" required autocomplete="off">
                </div>
                <div id="loginError" class="error-text hidden">Invalid or used code.</div>
                
                <button type="submit" class="btn btn-teal">Unlock System</button>
            </form>
        </div>
        
        <div class="footer mt-3">
            <small>&copy; 2026 Personal Growth OS</small>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
