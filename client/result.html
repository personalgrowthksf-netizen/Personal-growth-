<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Report - Career OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <p class="mt-2 text-teal font-bold">Generating Your Path...</p>
    </div>

    <div class="screen-container">
        <div id="resultIntroView" class="card">
            <h1 class="text-teal text-center">📊 Report Ready</h1>
            <p class="text-muted text-center mb-2">Based on your inputs, we have generated your roadmap.</p>
            <button id="showFullReportBtn" class="btn btn-primary">View My Report</button>
        </div>

        <div id="reportView" class="card hidden" style="max-width: 500px;">
            <p id="userGreeting" class="text-muted text-center"></p>
            <h3 class="text-center mt-1">Recommended Path:</h3>
            <h2 id="pathTitle" class="text-teal text-center mb-1">...</h2>
            
            <p id="pathDescription" class="mb-2"></p>
            
            <div class="plan-section">
                <h4 class="text-red">🗓️ 30-Day Focus</h4>
                <ul id="list30Day" class="custom-list"></ul>
            </div>

            <div class="plan-section mt-1">
                <h4 class="text-teal">🔭 90-Day Focus</h4>
                <ul id="list90Day" class="custom-list"></ul>
            </div>

            <button id="finishSessionBtn" class="btn btn-primary mt-2">Finish & Lock Session</button>
            <button onclick="window.print()" class="btn btn-outline mt-1 no-print">Print Report</button>
        </div>

        <div id="sessionEndView" class="card hidden text-center">
            <h2 class="text-teal">Access Locked</h2>
            <p class="text-muted">Your session has ended and this code is now used.</p>
            <a href="index.html" class="btn btn-outline mt-2">Back Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
