<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - Career OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray">
    <div class="screen-container">
        <div id="reportView" class="card">
            <h2 id="pathTitle" class="text-teal text-center">Path</h2>
            <div class="mb-2">
                <h4>30-Day Plan</h4>
                <ul id="list30Day" class="custom-list"></ul>
            </div>
            <div class="mb-2">
                <h4>90-Day Plan</h4>
                <ul id="list90Day" class="custom-list"></ul>
            </div>
            <hr class="mb-2">
            <h3>Ask Your Personal Growth Guide</h3>
            <div id="chatBox" class="chat-container mb-1">
                <div class="msg bot">Hello! Ask me anything about your career, skills, or startup ideas.</div>
            </div>
            <div class="flex gap-1">
                <input type="text" id="chatInput" placeholder="How do I grow?" style="flex:1;">
                <button id="sendChatBtn" class="btn btn-primary" style="width:auto;">Send</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
