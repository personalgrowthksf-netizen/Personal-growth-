<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assessment - Career OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen-container">
        <!-- Flow Intro -->
        <div id="questionIntroView" class="card">
            <h2 class="text-teal text-center">🎯 Understanding You</h2>
            <p class="text-muted mb-2">Answer a few short questions so we can recommend the most practical next steps for you.</p>
            <ul class="custom-list">
                <li>Your current situation</li>
                <li>Your main goal</li>
                <li>Your risk appetite</li>
                <li>Your skill level</li>
            </ul>
            <button id="continueToFormBtn" class="btn btn-primary">➡️ Continue</button>
        </div>

        <!-- Question Flow -->
        <div id="questionFlow" class="card hidden">
            <div class="progress-container">
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            </div>
            <h2 id="qLabel" class="text-teal mb-2" style="font-size: 1.25rem;">Question</h2>
            <div id="qInputContainer" class="form-group"></div>
            <button id="nextQBtn" class="btn btn-primary">Next Step</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
