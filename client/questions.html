<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assessment - Career OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen-container">
        <div id="questionIntroView" class="card">
            <h2 class="text-teal text-center">🎯 Understanding You</h2>
            <p class="text-muted mb-2">We'll ask a few questions to build your custom path.</p>
            <ul class="custom-list">
                <li>Current Situation</li>
                <li>Primary Goals</li>
                <li>Risk Appetite</li>
                <li>Skill Level</li>
            </ul>
            <button id="continueToFormBtn" class="btn btn-primary">➡️ Continue</button>
        </div>

        <div id="questionFlow" class="card hidden">
            <div class="progress-container">
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            </div>
            <h2 id="qLabel" class="text-teal mb-2">Question</h2>
            <div id="qInputContainer" class="form-group"></div>
            <button id="nextQBtn" class="btn btn-primary">Next Step</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
