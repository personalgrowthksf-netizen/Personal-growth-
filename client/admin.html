<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Personal Growth OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray">

    <!-- Admin Login Section -->
    <div id="adminLoginSection" class="container text-center fade-in">
        <h1 class="text-dark">Admin Access</h1>
        <div class="card">
            <form id="adminLoginForm">
                <div class="form-group">
                    <input type="password" id="adminSecret" placeholder="Enter Secret Code" required>
                </div>
                <div id="adminLoginError" class="error-text hidden">Access Denied</div>
                <button type="submit" class="btn btn-dark">Enter Panel</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Section (Hidden by default) -->
    <div id="adminDashboard" class="container fade-in hidden">
        <header class="flex-between mb-2">
            <h2 class="text-teal">Admin Dashboard</h2>
            <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
        </header>

        <!-- Generate Code Card -->
        <div class="card mb-2">
            <h3 class="text-dark mb-1">Generate Premium Code</h3>
            <form id="generateCodeForm">
                <div class="form-group">
                    <label for="attendeeName">Attendee Name</label>
                    <input type="text" id="attendeeName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label for="attendeePhone">WhatsApp Number</label>
                    <input type="tel" id="attendeePhone" placeholder="91XXXXXXXXXX" pattern="[0-9]{10,12}" required>
                </div>
                <button type="submit" class="btn btn-red w-100">Generate Code</button>
            </form>

            <!-- Result Display -->
            <div id="generatedResult" class="mt-2 hidden p-1 border-teal rounded bg-light">
                <p class="text-dark"><strong>Generated Code:</strong></p>
                <div class="code-display text-teal" id="displayCode"></div>
                <a href="#" id="whatsappLink" target="_blank" class="btn btn-green mt-1 w-100">
                    Send via WhatsApp
                </a>
            </div>
        </div>

        <!-- Attendees Table -->
        <div class="card">
            <h3 class="text-dark mb-1">Recent Attendees</h3>
            <div class="table-responsive">
                <table class="w-100 text-left">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Code</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendeesTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
